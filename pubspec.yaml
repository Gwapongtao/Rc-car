name: voice_led
description: "Voice command demo: turn the ESP32 GPIO 2 LED on and off over Wi-Fi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: 7.4.0   # speech recognition (offline on the phone)
  # Wi-Fi uses Dart's built-in dart:io, so no extra package is needed.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
